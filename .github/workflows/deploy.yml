name: Deploy NAVI API (Production Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: navi-api-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Production Deploy on Mac mini (vllm-1)
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync code to Production Directory
        timeout-minutes: 1
        run: |
          set -e
          REPO_DIR="$HOME/Documents/tendermind/navi-api"
          mkdir -p "$REPO_DIR"

          echo "🔄 Syncing latest code to $REPO_DIR..."
          # Sync checked-out repository to production directory, preserving .env and persistent data
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='data' \
            ./ "$REPO_DIR/"

          echo "✅ Code sync complete."

      - name: Build and Deploy Production Docker Containers
        run: |
          set -e
          REPO_DIR="$HOME/Documents/tendermind/navi-api"
          cd "$REPO_DIR"

          echo "🐳 Building Docker images (using cache)..."
          docker compose build

          echo "🚀 Starting production services (PostgreSQL 16 + Gunicorn ASGI)..."
          docker compose up -d --remove-orphans

          echo "⏳ Waiting for services to become healthy..."
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' navi-api-service 2>/dev/null || echo '"starting"')
            if [ "$STATUS" = '"healthy"' ]; then
              echo "✅ Navi API service is healthy!"
              break
            fi
            echo "Waiting for health check... ($i/30)"
            sleep 2
          done

          echo "📊 Active Containers:"
          docker compose ps

      - name: Prune Dangling Build Artifacts
        run: |
          docker image prune -f || true
