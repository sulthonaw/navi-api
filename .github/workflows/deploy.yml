name: Deploy NAVI API (Production Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: navi-api-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Production Deploy on Mac mini (vllm-1)
    runs-on: self-hosted

    steps:
      - name: Update Production Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "$HOME/Documents/tendermind/navi-api"
          echo "🔄 Fetching latest code via authenticated token..."
          git fetch "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" main
          git reset --hard FETCH_HEAD
          echo "✅ Repository updated to latest main."

      - name: Build and Deploy Production Docker Containers
        run: |
          set -e
          cd "$HOME/Documents/tendermind/navi-api"
          echo "🐳 Building and starting production containers..."
          docker compose build
          docker compose up -d --remove-orphans
          echo "📊 Active Containers:"
          docker compose ps
