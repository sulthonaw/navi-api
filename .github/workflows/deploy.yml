name: Deploy NAVI API (Production Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: navi-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Production Deploy on Mac mini (vllm-1)
    runs-on: self-hosted

    steps:
      - name: Update Production Repository
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          export GIT_TERMINAL_PROMPT=0
          export GIT_SSH_COMMAND="ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
          REPO_DIR="$HOME/Documents/tendermind/navi-api"

          if [ ! -d "$REPO_DIR/.git" ]; then
            echo "❌ Repository not found at $REPO_DIR"
            exit 1
          fi

          echo "🔄 Fetching latest code (SSH with 1-minute timeout limit)..."
          # Try SSH fetch in non-interactive batch mode; fallback to ephemeral GITHUB_TOKEN if needed
          if ! git -C "$REPO_DIR" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch origin main; then
            echo "⚠️ SSH fetch failed or key unauthenticated in runner environment, falling back to GITHUB_TOKEN..."
            git -C "$REPO_DIR" fetch "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" main
          fi

          git -C "$REPO_DIR" reset --hard FETCH_HEAD

          echo "✅ Repository successfully updated."

      - name: Build and Deploy Production Docker Containers
        run: |
          set -e
          REPO_DIR="$HOME/Documents/tendermind/navi-api"
          cd "$REPO_DIR"

          echo "🐳 Building heavy production Docker images..."
          docker compose build --pull

          echo "🚀 Starting production services (PostgreSQL 16 + Gunicorn ASGI)..."
          docker compose up -d --remove-orphans

          echo "⏳ Waiting for services to become healthy..."
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' navi-api-service 2>/dev/null || echo '"starting"')
            if [ "$STATUS" = '"healthy"' ]; then
              echo "✅ Navi API service is healthy!"
              break
            fi
            echo "Waiting for health check... ($i/30)"
            sleep 2
          done

          echo "📊 Active Containers:"
          docker compose ps

      - name: Prune Dangling Build Artifacts
        run: |
          docker image prune -f || true
