openapi: 3.1.0
info:
  title: Navi Exam & Socratic Engine API
  description: High-integrity Python examination backend featuring a kiosk-locking
    environment, Socratic AI tutoring powered by Google Gemini, native AST syntax
    validation, and real-time anti-cheat teacher monitoring.
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      tags:
      - System & Health
      summary: Check server health and database status
      description: Returns overall health status, version, runtime environment, and
        database connectivity.
      operationId: check_health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/rooms:
    post:
      tags:
      - Exam Sessions
      summary: Create a new exam session
      description: Allows a teacher to create a new exam room with starter code, test
        cases, and hint rules. Returns a unique room code.
      operationId: create_exam_room_api_v1_rooms_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamSessionCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/rooms/{room_code}:
    get:
      tags:
      - Exam Sessions
      summary: Get exam room details and student roster
      description: Fetches room status, problem statement, test cases, and the list
        of active students for the teacher's live dashboard.
      operationId: get_exam_room_api_v1_rooms__room_code__get
      parameters:
      - name: room_code
        in: path
        required: true
        schema:
          type: string
          title: Room Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSessionDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/rooms/{room_code}/close:
    patch:
      tags:
      - Exam Sessions
      summary: Conclude and close an exam session
      description: Marks the exam room as inactive and broadcasts a conclusion notification
        to all connected clients.
      operationId: close_exam_room_api_v1_rooms__room_code__close_patch
      parameters:
      - name: room_code
        in: path
        required: true
        schema:
          type: string
          title: Room Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/students/join:
    post:
      tags:
      - Student Sessions
      summary: Join an exam room from student kiosk
      description: Validates room code, registers student participant, and delivers
        the problem story, starter code, and hint quota.
      operationId: join_exam_room_api_v1_students_join_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentJoinRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentJoinResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/students/{student_id}:
    get:
      tags:
      - Student Sessions
      summary: Get current student status and quota
      description: Returns current metrics for a specific student, including hint
        usage and violation counter.
      operationId: get_student_status_api_v1_students__student_id__get
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: integer
          title: Student Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/code/run:
    post:
      tags:
      - Code Execution
      summary: Run code against sample test cases
      description: Validates Python syntax via native AST, then executes code against
        sample test cases in an isolated subprocess sandbox.
      operationId: run_code_api_v1_code_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/code/submit:
    post:
      tags:
      - Code Execution
      summary: Submit final exam solution for grading
      description: Evaluates student solution against all test cases (both public
        and hidden), computes score percentage, and marks exam as submitted.
      operationId: submit_exam_code_api_v1_code_submit_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeSubmitRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSubmitResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/hints/request:
    post:
      tags:
      - Socratic AI Engine
      summary: Request a Socratic hint for an error
      description: Invokes the Google Gemini Socratic tutor engine with strict code-concealment
        guardrails. Decrements student's hint quota and returns reflective guiding
        questions pointing to the specific error line.
      operationId: request_socratic_hint_api_v1_hints_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocraticHintRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocraticHintResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/violations:
    post:
      tags:
      - Violations & Anti-Cheat
      summary: Report an anti-cheat kiosk violation
      description: Logged when student kiosk detects window blur, Alt+Tab, or unauthorized
        keys. Immediately alerts teacher dashboard via WebSockets.
      operationId: report_violation_api_v1_violations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViolationReportRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViolationReportResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - System & Health
      summary: Root healthcheck probe
      description: Top-level health check endpoint for container orchestrators and
        load balancers.
      operationId: root_health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /export-openapi:
    get:
      tags:
      - System & Health
      summary: Export raw OpenAPI schema
      description: Returns the full OpenAPI 3.1 JSON schema for frontend TypeScript
        client generation.
      operationId: export_openapi_schema_export_openapi_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    CodeRunRequest:
      properties:
        student_id:
          type: integer
          title: Student Id
          description: Student session ID
          examples:
          - 1
        problem_id:
          type: integer
          title: Problem Id
          description: Problem challenge ID
          examples:
          - 101
        source_code:
          type: string
          title: Source Code
          description: Python 3 source code written by student
          examples:
          - "def is_prime(n):\n    if n <= 1:\n        return False\n    for i in\
            \ range(2, int(n**0.5) + 1):\n        if n % i == 0:\n            return\
            \ False\n    return True\n\nif __name__ == '__main__':\n    n = int(input())\n\
            \    print(is_prime(n))\n"
      type: object
      required:
      - student_id
      - problem_id
      - source_code
      title: CodeRunRequest
      description: Schema for running student code against public test cases for a
        specific problem.
      example:
        problem_id: 101
        source_code: "def is_prime(n):\n    return n > 1\n"
        student_id: 1
    CodeRunResponse:
      properties:
        success:
          type: boolean
          title: Success
          description: Whether all evaluated test cases passed
          examples:
          - true
        has_syntax_error:
          type: boolean
          title: Has Syntax Error
          default: false
          examples:
          - false
        syntax_error_details:
          anyOf:
          - $ref: '#/components/schemas/SyntaxErrorDetail'
          - type: 'null'
        total_tests:
          type: integer
          title: Total Tests
          examples:
          - 2
        passed_tests:
          type: integer
          title: Passed Tests
          examples:
          - 2
        all_passed:
          type: boolean
          title: All Passed
          examples:
          - true
        test_results:
          items:
            $ref: '#/components/schemas/TestCaseRunResult'
          type: array
          title: Test Results
          default: []
        stdout:
          type: string
          title: Stdout
          default: ''
          examples:
          - 'True

            '
        stderr:
          type: string
          title: Stderr
          default: ''
          examples:
          - ''
      type: object
      required:
      - success
      - total_tests
      - passed_tests
      - all_passed
      title: CodeRunResponse
      description: Overall outcome of code execution against test cases.
      example:
        all_passed: true
        has_syntax_error: false
        passed_tests: 2
        stderr: ''
        stdout: 'True

          '
        success: true
        test_results:
        - actual_output: 'True

            '
          execution_time_ms: 15.2
          expected_output: 'True

            '
          input_data: '7

            '
          is_hidden: false
          passed: true
          test_case_id: 1
        total_tests: 2
    CodeSubmitRequest:
      properties:
        student_id:
          type: integer
          title: Student Id
          description: Student session ID
          examples:
          - 1
        problem_id:
          type: integer
          title: Problem Id
          description: Problem challenge ID
          examples:
          - 101
        source_code:
          type: string
          title: Source Code
          description: Final Python 3 source code for the problem
          examples:
          - "def is_prime(n):\n    return n > 1\n"
      type: object
      required:
      - student_id
      - problem_id
      - source_code
      title: CodeSubmitRequest
      description: Schema for submitting code solution for a specific problem.
    CodeSubmitResponse:
      properties:
        student_id:
          type: integer
          title: Student Id
          examples:
          - 1
        problem_id:
          type: integer
          title: Problem Id
          examples:
          - 101
        is_passed:
          type: boolean
          title: Is Passed
          description: Whether all test cases passed
          examples:
          - true
        points_earned:
          type: integer
          title: Points Earned
          description: Points earned for this problem
          examples:
          - 20
        passed_tests:
          type: integer
          title: Passed Tests
          examples:
          - 5
        total_tests:
          type: integer
          title: Total Tests
          examples:
          - 5
        status:
          type: string
          title: Status
          description: Submission status (e.g. accepted, wrong_answer)
          examples:
          - accepted
        total_score_accumulated:
          type: integer
          title: Total Score Accumulated
          description: Total points accumulated across all problems
          examples:
          - 45
        score_percentage:
          type: number
          title: Score Percentage
          description: Percentage of test cases passed for this problem
          default: 100.0
          examples:
          - 100.0
        submitted_at:
          type: string
          format: date-time
          title: Submitted At
          description: Timestamp of submission
      type: object
      required:
      - student_id
      - problem_id
      - is_passed
      - points_earned
      - passed_tests
      - total_tests
      - status
      - total_score_accumulated
      - submitted_at
      title: CodeSubmitResponse
      description: Grading verdict for problem submission with points and total accumulated
        score.
    ExamSessionCreate:
      properties:
        title:
          type: string
          maxLength: 255
          minLength: 3
          title: Title
          description: Exam or session title
          examples:
          - Ujian Akhir Semester Pemrograman Dasar
        duration_minutes:
          type: integer
          maximum: 360.0
          minimum: 5.0
          title: Duration Minutes
          description: Exam duration in minutes
          default: 90
          examples:
          - 90
        hint_quota:
          type: integer
          maximum: 10.0
          minimum: 1.0
          title: Hint Quota
          description: Default Socratic hint quota per student
          default: 5
          examples:
          - 5
        allow_syntax_hints:
          type: boolean
          title: Allow Syntax Hints
          description: Enable Socratic hints for syntax errors
          default: true
          examples:
          - true
        allow_logic_hints:
          type: boolean
          title: Allow Logic Hints
          description: Enable Socratic hints for runtime/logic errors
          default: true
          examples:
          - true
        problems:
          items:
            $ref: '#/components/schemas/ProblemCreate'
          type: array
          minItems: 1
          title: Problems
          description: List of challenge problems in this examination session
      type: object
      required:
      - title
      - problems
      title: ExamSessionCreate
      description: Schema for teacher creating a new multi-problem exam room.
      example:
        allow_logic_hints: true
        allow_syntax_hints: true
        duration_minutes: 90
        hint_quota: 5
        problems:
        - category: Number Theory
          constraints:
          - 1 <= n <= 10^6
          description: Write a function named is_prime(n)...
          difficulty: Easy
          points: 20
          starter_code: "def is_prime(n):\n    pass\n"
          test_cases:
          - expected_output: 'True

              '
            input_data: '7

              '
            is_hidden: false
          - expected_output: 'False

              '
            input_data: '4

              '
            is_hidden: true
          title: Prime Number Verification
        title: Ujian Akhir Semester Pemrograman Dasar
    ExamSessionDetailResponse:
      properties:
        id:
          type: integer
          title: Id
        room_code:
          type: string
          title: Room Code
          description: Unique 8-character room invitation code
          examples:
          - NAVI-8392
        title:
          type: string
          title: Title
        duration_minutes:
          type: integer
          title: Duration Minutes
        started_at:
          type: string
          format: date-time
          title: Started At
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        hint_quota:
          type: integer
          title: Hint Quota
        allow_syntax_hints:
          type: boolean
          title: Allow Syntax Hints
        allow_logic_hints:
          type: boolean
          title: Allow Logic Hints
        is_active:
          type: boolean
          title: Is Active
        problems:
          items:
            $ref: '#/components/schemas/ProblemResponse'
          type: array
          title: Problems
          default: []
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        students:
          items:
            $ref: '#/components/schemas/StudentSummary'
          type: array
          title: Students
          default: []
      type: object
      required:
      - id
      - room_code
      - title
      - duration_minutes
      - started_at
      - hint_quota
      - allow_syntax_hints
      - allow_logic_hints
      - is_active
      - created_at
      - updated_at
      title: ExamSessionDetailResponse
      description: Full exam room details including active student roster.
    ExamSessionResponse:
      properties:
        id:
          type: integer
          title: Id
        room_code:
          type: string
          title: Room Code
          description: Unique 8-character room invitation code
          examples:
          - NAVI-8392
        title:
          type: string
          title: Title
        duration_minutes:
          type: integer
          title: Duration Minutes
        started_at:
          type: string
          format: date-time
          title: Started At
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        hint_quota:
          type: integer
          title: Hint Quota
        allow_syntax_hints:
          type: boolean
          title: Allow Syntax Hints
        allow_logic_hints:
          type: boolean
          title: Allow Logic Hints
        is_active:
          type: boolean
          title: Is Active
        problems:
          items:
            $ref: '#/components/schemas/ProblemResponse'
          type: array
          title: Problems
          default: []
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - room_code
      - title
      - duration_minutes
      - started_at
      - hint_quota
      - allow_syntax_hints
      - allow_logic_hints
      - is_active
      - created_at
      - updated_at
      title: ExamSessionResponse
      description: Schema for basic exam room details.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: Overall health status
          examples:
          - healthy
        version:
          type: string
          title: Version
          description: Application version
          examples:
          - 1.0.0
        environment:
          type: string
          title: Environment
          description: Active runtime environment
          examples:
          - development
        database_connected:
          type: boolean
          title: Database Connected
          description: Database connection health
          examples:
          - true
      type: object
      required:
      - status
      - version
      - environment
      - database_connected
      title: HealthResponse
      description: Schema for server health diagnostic output.
      example:
        database_connected: true
        environment: development
        status: healthy
        version: 1.0.0
    ProblemCreate:
      properties:
        title:
          type: string
          maxLength: 255
          minLength: 3
          title: Title
          description: Problem title
          examples:
          - Prime Number Verification
        difficulty:
          type: string
          enum:
          - Easy
          - Medium
          - Hard
          title: Difficulty
          description: Problem difficulty tier
          default: Easy
          examples:
          - Easy
        points:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Points
          description: Problem point weight
          default: 20
          examples:
          - 20
        category:
          type: string
          title: Category
          description: Problem topical category
          default: General
          examples:
          - Number Theory
        description:
          type: string
          minLength: 5
          title: Description
          description: Problem description in Markdown format
          examples:
          - Write a function named is_prime(n) that checks if an integer is prime.
        constraints:
          items:
            type: string
          type: array
          title: Constraints
          description: Problem constraints and complexity bounds
          examples:
          - - 1 <= n <= 10^6
            - Function must return a boolean
        starter_code:
          type: string
          title: Starter Code
          description: Python starter code template
          default: "def solution():\n    pass\n"
          examples:
          - "def is_prime(n):\n    pass\n"
        test_cases:
          items:
            $ref: '#/components/schemas/TestCaseCreate'
          type: array
          minItems: 1
          title: Test Cases
          description: List of automated test cases
          examples:
          - - expected_output: 'True

                '
              input_data: '7

                '
              is_hidden: false
            - expected_output: 'False

                '
              input_data: '4

                '
              is_hidden: true
      type: object
      required:
      - title
      - description
      - test_cases
      title: ProblemCreate
      description: Schema for creating a challenge problem within an exam session.
    ProblemResponse:
      properties:
        id:
          type: integer
          title: Id
        exam_session_id:
          type: integer
          title: Exam Session Id
        title:
          type: string
          title: Title
        difficulty:
          type: string
          title: Difficulty
        points:
          type: integer
          title: Points
        category:
          type: string
          title: Category
        description:
          type: string
          title: Description
        constraints:
          items:
            type: string
          type: array
          title: Constraints
        starter_code:
          type: string
          title: Starter Code
        test_cases:
          items:
            $ref: '#/components/schemas/TestCaseResponse'
          type: array
          title: Test Cases
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - exam_session_id
      - title
      - difficulty
      - points
      - category
      - description
      - constraints
      - starter_code
      - test_cases
      - created_at
      - updated_at
      title: ProblemResponse
      description: Comprehensive problem details including hidden test cases (for
        teacher console).
    PublicProblemResponse:
      properties:
        id:
          type: integer
          title: Id
          description: Problem ID
          examples:
          - 101
        title:
          type: string
          title: Title
          description: Problem title
          examples:
          - Prime Number Verification
        difficulty:
          type: string
          title: Difficulty
          description: Difficulty
          examples:
          - Easy
        points:
          type: integer
          title: Points
          description: Point value
          examples:
          - 20
        category:
          type: string
          title: Category
          description: Category
          examples:
          - Number Theory
        description:
          type: string
          title: Description
          description: Markdown description
          examples:
          - Write a function named is_prime(n)...
        constraints:
          items:
            type: string
          type: array
          title: Constraints
          description: Problem constraints
          examples:
          - - 1 <= n <= 10^6
            - Function must return a boolean
        starter_code:
          type: string
          title: Starter Code
          description: Starter template
          examples:
          - "def is_prime(n):\n    pass\n"
        public_test_cases:
          items:
            $ref: '#/components/schemas/PublicTestCase'
          type: array
          title: Public Test Cases
          description: Public sample test cases for preview and sandbox testing
      type: object
      required:
      - id
      - title
      - difficulty
      - points
      - category
      - description
      - starter_code
      title: PublicProblemResponse
      description: Public problem details returned to student kiosks (hidden test
        cases omitted).
    PublicTestCase:
      properties:
        id:
          type: integer
          title: Id
          description: Test case ID
          examples:
          - 1
        input_data:
          type: string
          title: Input Data
          description: Standard input data
          examples:
          - '7

            '
        expected_output:
          type: string
          title: Expected Output
          description: Expected output string
          examples:
          - 'True

            '
      type: object
      required:
      - id
      - input_data
      - expected_output
      title: PublicTestCase
      description: Public sample test case exposed to students.
    SocraticHintRequest:
      properties:
        student_id:
          type: integer
          title: Student Id
          description: Student session ID
          examples:
          - 1
        problem_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Problem Id
          description: Target problem ID
          examples:
          - 101
        source_code:
          type: string
          title: Source Code
          description: Current Python source code with the encountered issue
          examples:
          - "def is_prime(n):\n    for i in range(2, n)\n        if n % i == 0:\n\
            \            return False\n    return True\n"
        error_type:
          type: string
          title: Error Type
          description: 'Category of error: SyntaxError, IndentationError, IndexError,
            ZeroDivisionError, WrongAnswer, etc.'
          examples:
