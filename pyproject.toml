[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "navi-api"
version = "1.0.0"
description = "Navi Exam & Socratic AI Engine API"
authors = [{ name = "Navi Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "google-genai>=0.3.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "websockets>=13.0",
    "ruff>=0.8.0",
    "gunicorn>=23.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long
    "B008", # function call in argument defaults (FastAPI Depends)
    "E712", # comparison to True/False (SQLAlchemy query)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
